interface:
  display_name: "Media User Info"
  short_description: "Retrieve creator profiles"
  default_prompt: "Use $media-user-info to retrieve creator profile information from platform-supported XHS, Douyin, Kuaishou, Bilibili, Zhihu, Instagram, X / Twitter, YouTube, TikTok, Weibo, Toutiao, or WeChat Channels user IDs, usernames, channel URLs, profile URLs, short links, or share text. Supported input forms vary by platform. Also supports Haokan / 好看视频."

policy:
  allow_implicit_invocation: true
